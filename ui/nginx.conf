# Local web server for the built UI (docker-compose.yml), mounted into the
# stock nginx image in place of its default site. On Azure the UI is a Storage
# static website, which serves each file with the content type it was uploaded
# with, so the deploy pipeline sets the same two rules when it uploads.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # nginx's built-in types do not include .mjs, and browsers refuse to start
  # pdf.js's module worker when it arrives as application/octet-stream.
  location ~ \.mjs$ {
    types { text/javascript mjs; }
  }

  # Rewritten per environment, so it must never be served from a cache.
  location = /config.js {
    add_header Cache-Control "no-store";
  }
}
